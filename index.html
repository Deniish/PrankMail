<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Careers — Application Update</title>

<style>
  body {
    margin: 0;
    background: #f7f9fc;
    font-family: Arial, Helvetica, sans-serif;
    color: #202124;
  }

  .wrap {
    max-width: 760px;
    margin: 48px auto;
    padding: 0 20px;
  }

  .card {
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 14px;
    padding: 38px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    overflow: hidden;
  }

  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
  }

  .logo span:nth-child(1){color:#4285f4}
  .logo span:nth-child(2){color:#ea4335}
  .logo span:nth-child(3){color:#fbbc05}
  .logo span:nth-child(4){color:#34a853}
  .logo span:nth-child(5){color:#4285f4}
  .logo span:nth-child(6){color:#ea4335}

  .pill {
    display: inline-block;
    margin-top: 18px;
    padding: 7px 12px;
    border-radius: 999px;
    background: #f1f3f4;
    color: #5f6368;
    font-size: 12px;
    font-weight: 700;
  }

  h1 {
  font-size: 44px;
  font-weight: 800;
  line-height: 1.05;
  margin: 22px 0 10px;
}

  p {
    font-size: 16px;
    line-height: 1.6;
    color: #5f6368;
  }

  /* IMAGE ROW */
  .image-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 28px;
  }

  .prank-img {
    width: 42%;
    max-width: 260px;
    height: auto;
    border-radius: 14px;
    display: block;
    box-shadow: 0 8px 20px rgba(0,0,0,.18);

    /* Funny animation */
    animation: goofy 2.8s ease-in-out infinite;
    transform-origin: center;
  }

  .prank-img:nth-child(2) {
    animation-delay: 0.35s;
  }

  /* Bounce + wobble + tiny rotation */
  @keyframes goofy {
    0%, 100% {
      transform: translateY(0) rotate(0deg) scale(1);
    }

    15% {
      transform: translateY(-7px) rotate(-2deg) scale(1.02);
    }

    30% {
      transform: translateY(2px) rotate(2deg) scale(1.01);
    }

    45% {
      transform: translateY(-4px) rotate(-1deg) scale(1.03);
    }

    60% {
      transform: translateY(0) rotate(1deg) scale(1);
    }

    75% {
      transform: translateY(-2px) rotate(-1deg) scale(1.01);
    }
  }

  /* Extra chaotic effect on hover */
  .prank-img:hover {
    animation: brutalShake 0.35s infinite;
    cursor: pointer;
  }

  @keyframes brutalShake {
    0%   { transform: translate(0,0) rotate(0deg) scale(1.02); }
    20%  { transform: translate(-5px,2px) rotate(-2deg) scale(1.04); }
    40%  { transform: translate(5px,-2px) rotate(2deg) scale(1.03); }
    60%  { transform: translate(-4px,-1px) rotate(-1deg) scale(1.05); }
    80%  { transform: translate(4px,2px) rotate(1deg) scale(1.03); }
    100% { transform: translate(0,0) rotate(0deg) scale(1.02); }
  }

  .tiny {
    font-size: 11px;
    color: #9aa0a6;
    margin-top: 30px;
  }

  @media (max-width: 600px) {
    .card {
      padding: 24px;
    }

    h1 {
      font-size: 29px;
    }

    .image-row {
      gap: 10px;
    }

    .prank-img {
      width: 46%;
    }
  }
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="logo">
      <span>G</span><span>o</span><span>o</span>
      <span>g</span><span>l</span><span>e</span>
    </div>

    <div class="pill">How to fool Monkey 🐒</div>

    <h1>Look At Your Excitement Face 😭</h1>

    <p><strong>Unemployed Chud</strong></p>

    <p>
      Congratulations on making it this far.
      Unfortunately, there is no job offer here.
      You have been successfully pranked. 😂
    </p>

    <!-- SIDE BY SIDE IMAGES -->
    <div class="image-row">
      <img class="prank-img" src="fu2.jpg" alt="Prank image 1">
      <img class="prank-img" src="funtoo.jpg" alt="Prank image 2">
    </div>

    <p class="tiny">
      Just a joke dont block me LOL.
    </p>

  </div>
</div>

</body>
</html>
